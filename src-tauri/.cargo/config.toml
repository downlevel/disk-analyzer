# Limita i job paralleli di rustc: con 14 CPU logiche e poca RAM libera la compilazione
# di crate grandi (es. tokio) finiva con "rustc-LLVM ERROR: out of memory".
[build]
jobs = 3

[env]
# Cartella in cui ts-rs genera i binding TypeScript (relativa a src-tauri/).
TS_RS_EXPORT_DIR = { value = "../src/bindings", relative = true }